name: security_evaluation_app
description: Security Assessment System - Mobile Application
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  lottie: ^2.7.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Navigation
  go_router: ^12.0.0
  
  # Networking
  dio: ^5.3.0
  retrofit: ^4.0.1
  socket_io_client: ^2.0.1
  
  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.0
  
  # Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.6
  cryptography: ^2.5.0
  pointycastle: ^3.7.3
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.0
  firebase_storage: ^11.6.0
  firebase_crashlytics: ^3.4.0
  firebase_analytics: ^10.8.0
  firebase_remote_config: ^4.3.0
  
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
  connectivity_plus: ^5.0.2
  permission_handler: ^10.4.3
  device_info_plus: ^9.1.0
  package_info_plus: ^5.0.1
  image_picker: ^1.0.4
  file_picker: ^5.5.0
  
  # Charts & Visualization
  fl_chart: ^0.63.0
  syncfusion_flutter_charts: ^33.2.7
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl_utils: ^2.8.3
  
  # Code Generation
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  
  # Background Tasks
  workmanager: ^0.5.1
  flutter_background_service: ^5.0.1
  
  # Biometric & Authentication
  
  # PDF & Document
  flutter_pdfview: ^1.3.2
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.0
  
  # Animation
  rive: ^0.12.4
  
  # Logging
  logger: ^1.4.0
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Caching
  flutter_cache_manager: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  freezed: ^2.4.2
  retrofit_generator: ^7.0.8
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/images/icons/
    - assets/fonts/
    - assets/animations/
    - assets/translations/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
    
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
    
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  main_locale: en
  arb_dir: lib/localization
  output_dir: lib/localization/generated

  dependency_overrides:
  intl: 0.20.2